<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>锅嘚刚的生日夜</title>
<meta name="theme-color" content="#2b2d5c">
<link rel="preload" href="px.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Px";src:url(px.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Wish";src:url(wish.woff2) format("woff2");font-display:swap}
:root{--ink:#3a241e;--cream:#fff8ec;--cream2:#f3dcc4;--pink:#ff8fab;--pink2:#e5577d;--pinkL:#ffc2d1;--butter:#ffd45e;--butter2:#e0a92c;--mint:#7fd8be;--mint2:#3fae8f;--sky:#2b2d5c;
--px:"Px","PingFang SC","Microsoft YaHei",monospace;--ease:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:#1f2047;color:var(--ink);font-family:var(--px);overflow:hidden;-webkit-font-smoothing:none;font-smooth:never}
img,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
body{display:flex;justify-content:center;align-items:center}
#backdrop{position:fixed;inset:0;background:linear-gradient(#1f2047 0 25%,#2b2d5c 25% 50%,#3b3672 50% 75%,#4b3f80 75%)}
#backdrop::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#fff 0 0),linear-gradient(#fff 0 0);background-size:4px 4px;background-repeat:no-repeat;
box-shadow:none;opacity:.0}
#app{position:relative;width:100%;max-width:430px;height:100vh;overflow:hidden;background:#2b2d5c}
@supports(height:100dvh){#app{height:100dvh}}
@media(min-width:500px){#app{height:min(100dvh,920px);border:6px solid var(--ink);box-shadow:8px 8px 0 rgba(0,0,0,.45)}}
.screen{position:absolute;inset:0;transition:opacity .8s steps(8)}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
.pxbox{background:var(--cream);border:4px solid var(--ink);box-shadow:inset -4px -4px 0 var(--cream2),inset 4px 4px 0 #fff,6px 6px 0 rgba(20,10,30,.35)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;font-size:18px;letter-spacing:.06em;color:#fff;background:var(--pink);
border:4px solid var(--ink);box-shadow:inset -4px -4px 0 var(--pink2),inset 4px 4px 0 var(--pinkL),0 4px 0 var(--ink);text-shadow:2px 2px 0 var(--pink2)}
.btn:active{transform:translateY(4px);box-shadow:inset -4px -4px 0 var(--pink2),inset 4px 4px 0 var(--pinkL),0 0 0 var(--ink)}
.btn.alt{background:var(--butter);color:var(--ink);text-shadow:none;box-shadow:inset -4px -4px 0 var(--butter2),inset 4px 4px 0 #fff0b8,0 4px 0 var(--ink)}
.btn.ghost{background:#fff;color:var(--ink);text-shadow:none;box-shadow:inset -4px -4px 0 #ddd,inset 4px 4px 0 #fff,0 4px 0 var(--ink)}
.btn.mint{background:var(--mint);box-shadow:inset -4px -4px 0 var(--mint2),inset 4px 4px 0 #c6f2e4,0 4px 0 var(--ink);text-shadow:2px 2px 0 var(--mint2)}
.btn[disabled]{filter:grayscale(.6);pointer-events:none}
/* ---------- GATE ---------- */
#gate{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px 27%;text-align:center;z-index:20;overflow:hidden;
background:linear-gradient(#17183a 0 16%,#1f2047 16% 32%,#2b2d5c 32% 48%,#3b3672 48% 62%,#55407f 62% 74%,#7a4a8a 74% 84%,#a85a8e 84%)}
.star{position:absolute;width:3px;height:3px;background:#fff;animation:tw 1.6s steps(2) infinite}
.star.b{width:3px;height:3px;background:#ffe9a8;box-shadow:3px 0 #ffe9a8,-3px 0 #ffe9a8,0 3px #ffe9a8,0 -3px #ffe9a8}
@keyframes tw{50%{opacity:.2}}
#gmoon{position:absolute;right:9%;top:6%;width:48px}
#gbunt{position:absolute;left:0;right:0;top:0;height:36px}
#gbunt svg,#gmoon svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}
#gclouds{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.cl{position:absolute;left:-30%;height:auto;image-rendering:pixelated;animation:drift linear infinite}
@keyframes drift{from{left:-30%}to{left:100%}}
#fw{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none;z-index:6}
.gcard{z-index:5;transition:opacity .5s,transform .5s}
.gcard.gone{opacity:0;transform:translateY(30px) scale(.96)}
#wishBtn.dim{opacity:.45}
#gcity{position:absolute;left:0;bottom:0;width:100%;display:block;pointer-events:none}
.ripple{position:absolute;height:3px;background:#ffd45e;opacity:.8;animation:tw 1.2s steps(2) infinite;pointer-events:none}
.gcard{position:relative;width:100%;max-width:340px;padding:62px 16px 16px;margin-top:40px}
.peek{position:absolute;left:50%;top:-58px;transform:translateX(-50%);width:105px;height:108px}
.peek img{position:absolute;left:0;top:0;width:105px;clip-path:inset(0 0 26% 0)}
.lockbox{position:absolute;right:-26px;bottom:-4px;width:42px;height:45px;animation:hop 1.2s steps(2) infinite}
@keyframes hop{50%{transform:translateY(-3px)}}
.lockbox svg{width:100%;height:100%;overflow:visible;shape-rendering:crispEdges}
.lockbox .shackle{transition:transform .5s steps(4)}
.lockbox.open{animation:none}
.lockbox.open .shackle{transform:translate(3px,-3px)}
.ribbon{position:relative;display:inline-block;margin:0 auto 4px;padding:6px 18px;background:var(--pink);color:#fff;font-size:24px;letter-spacing:.06em;
border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);text-shadow:2px 2px 0 var(--pink2)}
.ribbon::before,.ribbon::after{content:"";position:absolute;top:6px;width:18px;height:calc(100% + 0px);background:var(--pink2);border:3px solid var(--ink);z-index:-1}
.ribbon::before{left:-14px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,40% 50%)}
.ribbon::after{right:-14px;clip-path:polygon(0 0,100% 0,60% 50%,100% 100%,0 100%)}
.gsub{font-size:13px;color:#8a6656;letter-spacing:.1em;margin:6px 0 14px}
.lab{display:inline-block;font-size:12px;letter-spacing:.2em;color:#fff;background:var(--ink);padding:2px 10px;margin-bottom:8px}
.code{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin:0 auto}
.code i{font-style:normal;width:21px;height:27px;line-height:24px;font-size:16px;background:#fff;color:var(--ink);border:3px solid var(--ink);box-shadow:inset -3px -3px 0 #e6d6c6}
.code i.pk{background:var(--pinkL)}
.gate-tip{font-size:14px;color:var(--ink);margin:16px 0 10px;letter-spacing:.04em}
.gate-row{display:flex;gap:6px;width:100%}
.gate-row input{flex:1;min-width:0;padding:12px 12px;border:4px solid var(--ink);background:#fff;color:var(--ink);font-size:16px;outline:none;font-family:inherit;box-shadow:inset 4px 4px 0 #e8e0d8}
.gate-row .btn{padding:10px 16px}
.err{color:var(--pink2);font-size:13px;min-height:20px;margin-top:8px}
.shake{animation:shake .4s steps(4)}
@keyframes shake{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
#clueBtn{font-size:13px;color:#8a6656;padding:4px 10px;border:3px dashed #c9ad98}
#clues{margin-top:10px;font-size:13px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:8px}
#clues>div:not(.keypad){background:var(--cream);border:4px solid var(--ink);padding:5px 10px}
.keypad{display:grid;grid-template-columns:repeat(3,58px);gap:6px}
.keypad div{padding:4px 0;background:#fff;border:3px solid var(--ink);box-shadow:inset -3px -3px 0 #ddd;line-height:1.15}
.keypad b{display:block;font-size:16px;color:var(--pink2)}
.keypad span{font-size:10px;color:#8a6656}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40}
/* ---------- ROOM ---------- */
#room{opacity:0;z-index:10}
#room.on{opacity:1}
#scene{position:absolute}
#scene>img.bg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.spr{position:absolute;display:block;user-select:none;-webkit-user-drag:none}
.obj{cursor:pointer}
.obj.wig{animation:wig .45s steps(3)}
@keyframes wig{33%{transform:translateY(-8px) rotate(-4deg)}66%{transform:translateY(-4px) rotate(4deg)}}
#table{left:-6%;width:111.979%;top:57%;pointer-events:none;z-index:3}
#shibaWrap{position:absolute;left:32%;width:35.938%;bottom:41%;cursor:pointer;z-index:2}
#shiba{width:100%;display:block;transform-origin:50% 100%;animation:breathe 1.4s steps(2) infinite}
@keyframes breathe{50%{transform:scaleY(.97)}}
#shibaWrap.bounce #shiba{animation:jump .5s steps(4)}
@keyframes jump{25%{transform:translateY(-14px)}50%{transform:translateY(-22px)}75%{transform:translateY(-8px)}}
.food{z-index:4}
.food.front{z-index:6}
#cakeWrap{position:absolute;left:35%;width:30.208%;bottom:35.5%;cursor:pointer;z-index:5}
#cakeWrap>img{width:100%;display:block}
#cakeWrap.wig>img{animation:wig .45s steps(3)}
.flame{position:absolute;width:8.62%;transform:translate(-50%,-100%);pointer-events:none}
.flame svg{width:100%;display:block;shape-rendering:crispEdges;animation:flick .3s steps(2) infinite}
@keyframes flick{0%,100%{transform:scale(var(--fs,1))}50%{transform:scale(var(--fs,1)) scaleX(-1) translateY(-1px)}}
.flame::after{content:"";position:absolute;left:50%;top:50%;width:700%;height:500%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,210,110,.35),transparent 60%);transition:all .6s}
.lights-off .flame::after{width:1300%;height:900%;background:radial-gradient(circle,rgba(255,200,100,.5),transparent 60%)}
#cakeWrap .flame svg{transform-origin:50% 100%;transform:scale(var(--fs,1))}
#cakeWrap.windy .flame svg{animation:wind .12s steps(2) infinite}
@keyframes wind{0%{transform:scale(var(--fs,1)) translateX(-2px) skewX(-18deg)}100%{transform:scale(calc(var(--fs,1)*.85)) translateX(2px) skewX(-30deg)}}
#match{position:absolute;left:0;top:0;width:48px;z-index:12;pointer-events:none}
#match svg{width:100%;display:block;shape-rendering:crispEdges}
#match svg rect[fill="#ffd45e"],#match svg rect[fill="#ff9a3c"]{animation:blink .2s steps(2) infinite}
.busy #dock,.busy #shibaWrap,.busy .dish,.busy #giftSpot{pointer-events:none}
#blowBar{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 100px);z-index:31;padding:12px;text-align:center}
#blowBar .bt{font-size:16px;margin-bottom:8px}
#blowMeter{display:flex;gap:3px;justify-content:center;margin-bottom:10px}
#blowMeter i{width:18px;height:12px;border:3px solid var(--ink);background:#fff}
#blowMeter i.on{background:var(--mint)}
#blowHold{user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none;min-width:180px}
.smoke{position:absolute;width:8px;height:8px;background:rgba(255,255,255,.75);pointer-events:none;animation:smoke 1.6s steps(6) forwards}
@keyframes smoke{to{transform:translate(var(--dx),-60px) scale(3);opacity:0}}
#giftSpot{position:absolute;left:69%;width:18.229%;bottom:11%;cursor:pointer;z-index:7}
#giftSpot img{width:100%;display:block}
#giftSpot.locked img{filter:grayscale(.7) brightness(.85)}
#giftSpot.ready img{animation:giftHop 1s steps(4) infinite}
@keyframes giftHop{0%,60%,100%{transform:translateY(0)}20%{transform:translateY(-10px)}40%{transform:translateY(-4px)}}
#giftSpot .lock{position:absolute;right:-10%;top:-6%;font-size:12px;background:#fff;border:3px solid var(--ink);padding:2px 4px}
#giftSpot.ready .lock{display:none}
#giftSpot .tip{position:absolute;left:50%;bottom:104%;transform:translateX(-50%);white-space:nowrap;font-size:12px;padding:3px 7px;background:#fff;border:3px solid var(--ink);display:none}
#giftSpot.ready .tip,#giftSpot.claimed .tip{display:block}
#giftSpot.claimed .lock{display:none}
#giftSpot.claimed img{filter:saturate(.5)}
#lampHot{position:absolute;left:9%;top:35%;width:15%;height:10%;cursor:pointer;z-index:2}
#cozy{position:absolute;inset:0;pointer-events:none;z-index:7;animation:cozy 3.2s steps(4) infinite;
background:radial-gradient(ellipse 42% 26% at 17% 41%,rgba(255,196,110,.32),rgba(255,180,100,.12) 55%,rgba(255,180,100,0) 75%),
radial-gradient(ellipse 34% 22% at 50% 64%,rgba(255,200,130,.18),rgba(255,200,130,0) 70%),
radial-gradient(ellipse 30% 18% at 50% 30%,rgba(190,200,255,.10),rgba(190,200,255,0) 70%),
radial-gradient(ellipse 85% 70% at 50% 48%,rgba(80,30,30,0) 60%,rgba(80,30,30,.30) 100%)}
@keyframes cozy{50%{opacity:.86}}
#motes{position:absolute;inset:0;pointer-events:none;z-index:7;overflow:hidden}
.mote{position:absolute;width:3px;height:3px;background:#ffe2a8;opacity:0;animation:mote linear infinite}
@keyframes mote{0%{opacity:0;transform:translate(0,0)}15%{opacity:.75}50%{transform:translate(8px,-60px)}85%{opacity:.6}100%{opacity:0;transform:translate(-4px,-120px)}}
.lights-off #cozy{opacity:.5}
#dark{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s steps(5);z-index:8;background:rgba(10,8,28,.84)}
.lights-off #dark{opacity:1}
.lit #dark{background:radial-gradient(ellipse calc(21% * var(--f,1)) calc(13% * var(--f,1)) at calc(50% + var(--fx,0%)) 45%,rgba(15,12,40,0) 0 55%,rgba(15,12,40,.22) 55% 70%,rgba(15,12,40,.45) 70% 85%,rgba(12,10,32,.68) 85% 100%,rgba(10,8,28,.86) 100%)}
#glow{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:9;mix-blend-mode:soft-light;
background:radial-gradient(ellipse calc(17% * var(--f,1)) calc(11% * var(--f,1)) at calc(50% + var(--fx,0%)) 46%,rgba(255,196,96,1) 0 45%,rgba(255,170,80,.6) 45% 75%,rgba(255,150,70,0) 75%)}
#glow2{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:9;mix-blend-mode:screen;
background:radial-gradient(ellipse calc(9% * var(--f,1)) calc(6% * var(--f,1)) at calc(50% + var(--fx,0%)) 41%,rgba(255,170,70,.28) 0 60%,rgba(255,170,70,0) 60%)}
.lights-off.lit #glow{opacity:var(--g,.9)}
.lights-off.lit #glow2{opacity:var(--g,.9)}
.lights-off #dark{opacity:1}
#bubble{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);opacity:0;width:max-content;max-width:min(240px,68vw);padding:8px 12px;
background:#fff;color:var(--ink);font-size:14px;line-height:1.5;border:4px solid var(--ink);box-shadow:4px 4px 0 rgba(20,10,30,.35);pointer-events:none;text-align:center;transition:opacity .2s steps(2);z-index:9}
#bubble::after{content:"";position:absolute;left:50%;top:100%;margin-left:-8px;width:16px;height:12px;background:var(--ink);clip-path:polygon(0 0,100% 0,50% 100%)}
#bubble.show{opacity:1}
#topbar{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 12px 8px;gap:8px}
#topbar .ttl{font-size:15px;padding:6px 10px;white-space:nowrap}
.tbtns{display:flex;gap:6px}
.chip{padding:5px 8px;font-size:13px;background:#fff;border:3px solid var(--ink);box-shadow:inset -3px -3px 0 #ddd,3px 3px 0 rgba(20,10,30,.35)}
.chip:active{transform:translate(2px,2px)}
.chip.off{opacity:.5;text-decoration:line-through}
#hint{position:absolute;top:calc(env(safe-area-inset-top) + 62px);left:50%;transform:translateX(-50%);z-index:29;font-size:13px;padding:6px 10px;display:flex;gap:10px;align-items:center;max-width:94%;white-space:nowrap}
#hint .t{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#hint .t b{font-weight:400;color:#8a6656}
#hint .t b.ok{color:var(--mint2)}
#hint .t b.cur{color:var(--pink2)}
#hint #hintSkip{font-size:11px;color:#8a6656;border:2px dashed #c9ad98;padding:1px 5px}
#hint.done{background:var(--butter)}
#arrow{position:absolute;left:0;top:0;width:24px;z-index:28;pointer-events:none!important;transition:transform .3s steps(3)}
#arrow svg{pointer-events:none;width:100%;display:block;shape-rendering:crispEdges;animation:bob .6s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
#cakeWrap.call>img{animation:giftHop 1s steps(4) infinite}
#dock{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:30;display:flex;justify-content:space-around;padding:8px 4px}
#dock button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;padding:2px 10px;color:var(--ink);min-width:64px}
#dock button svg{width:30px;height:30px;shape-rendering:crispEdges}
#dock button:active{transform:translateY(3px)}
#dock button.dim{opacity:.45}
#toast{position:absolute;left:50%;top:30%;transform:translateX(-50%);z-index:70;opacity:0;pointer-events:none;transition:opacity .25s steps(3);padding:12px 18px;text-align:center;max-width:84%;font-size:16px;line-height:1.6}
#toast.show{opacity:1}
#toast small{display:inline-block;font-size:12px;color:#fff;background:var(--pink2);padding:2px 8px;margin-bottom:6px}
.floater{position:absolute;left:0;top:0;z-index:7;cursor:pointer;will-change:transform;opacity:.85}
.lights-off .floater{opacity:.35}
.floater svg{display:block;width:100%;shape-rendering:crispEdges}
.floatword{position:absolute;z-index:60;pointer-events:none;font-size:24px;color:#fff;text-shadow:3px 3px 0 var(--pink2),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);animation:rise 1.6s steps(8) forwards;white-space:nowrap}
@keyframes rise{0%{opacity:0;transform:translate(-50%,0)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-90px)}}
.heart{position:absolute;z-index:60;pointer-events:none;width:21px;animation:heart 1.1s steps(6) forwards}
.heart svg{width:100%;display:block;shape-rendering:crispEdges}
@keyframes heart{0%{opacity:0}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-80px)}}
#fx{position:absolute;inset:0;z-index:65;pointer-events:none;width:100%;height:100%}
.modal{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,14,40,.55);opacity:0;pointer-events:none;transition:opacity .25s steps(3)}
.modal.open{opacity:1;pointer-events:auto}
.panel{width:100%;max-width:380px;max-height:calc(100% - 12px);overflow:auto;padding:22px 16px 20px;position:relative}
.modal.open .panel{animation:pop .35s steps(4)}
@keyframes pop{0%{transform:scale(.6)}50%{transform:scale(1.06)}100%{transform:none}}
.panel h2{font-size:24px;text-align:center;font-weight:400;line-height:1.3}
.panel .kicker{display:block;width:max-content;margin:0 auto 10px;font-size:12px;letter-spacing:.12em;color:#fff;background:var(--pink2);padding:3px 10px}
.panel p.lead{text-align:center;font-size:14px;line-height:1.7;color:#7a5a4c;margin:8px 0 14px}
.x{position:absolute;right:8px;top:8px;width:32px;height:32px;background:#fff;border:3px solid var(--ink);font-size:18px;line-height:1;box-shadow:inset -3px -3px 0 #ddd}
.paper{position:relative;padding:10px 12px 6px;border:4px solid var(--ink);background:repeating-linear-gradient(180deg,#fffdf4 0 30px,#ffc2d1 30px 32px);box-shadow:inset 4px 4px 0 #fff}
.paper textarea{width:100%;height:192px;border:none;outline:none;resize:none;background:transparent;font-family:"Wish",var(--px);font-size:24px;line-height:32px;color:#3b2a8a;letter-spacing:.02em}
.paper textarea::placeholder{color:rgba(59,42,138,.35)}
.paper .count{text-align:right;font-size:12px;color:#7a5a4c}
.privacy{font-size:12px;line-height:1.6;color:#7a5a4c;margin:14px 2px;text-align:center}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.choice{display:block;width:100%;text-align:left;padding:14px 14px;border:4px solid var(--ink);background:#fff;box-shadow:inset -4px -4px 0 #eee,0 4px 0 var(--ink);margin-bottom:14px;position:relative}
.choice:active{transform:translateY(4px);box-shadow:inset -4px -4px 0 #eee}
.choice .tag{position:absolute;right:12px;top:12px;width:27px}
.choice .tag svg{width:100%;display:block;shape-rendering:crispEdges}
.choice h3{font-size:20px;font-weight:400;margin:0 0 6px;color:var(--pink2)}
.choice.b h3{color:var(--mint2)}
.choice p{font-size:13px;line-height:1.6;color:#7a5a4c;padding-right:42px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;perspective:900px;margin-top:6px}
.card{aspect-ratio:2/3;position:relative;transform-style:preserve-3d;transition:transform .6s steps(6);cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px;border:4px solid var(--ink)}

<script>

"use strict";
const $=s=>document.querySelector(s);
const app=$('#app');
/* =========================================================
   AUDIO  (Web Audio, all synthesized)
   ========================================================= */
const AUDIO=(()=>{
  let ctx=null,master,musicBus,sfxBus,noiseBuf,timer=null,mode='lofi',step=0,nextT=0,musicOn=true,sfxOn=true,level=1,bdayIdx=0;
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  function init(){
    if(ctx){if(ctx.state==='suspended')ctx.resume();return}
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    ctx=new AC(); master=ctx.createGain(); master.gain.value=.9; master.connect(ctx.destination);
    musicBus=ctx.createGain(); musicBus.gain.value=0; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2600; musicBus.connect(lp); lp.connect(master);
    sfxBus=ctx.createGain(); sfxBus.gain.value=.7; sfxBus.connect(master);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  function tone(freq,t,dur,{type='sine',vol=.2,attack=.005,bus,detune=0,glideTo}={}){
    const o=ctx.createOscillator(),g=ctx.createGain(); o.type=type; o.frequency.setValueAtTime(freq,t); o.detune.value=detune;
    if(glideTo)o.frequency.exponentialRampToValueAtTime(glideTo,t+dur);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+attack); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(bus||sfxBus); o.start(t); o.stop(t+dur+.05);
  }
  function noise(t,dur,{vol=.2,freq=3000,q=1,type='bandpass',bus}={}){
    const s=ctx.createBufferSource(); s.buffer=noiseBuf; const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
    const g=ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(bus||sfxBus); s.start(t,Math.random()*.5); s.stop(t+dur+.05);
  }
  function epiano(m,t,dur,vol){tone(mtof(m),t,dur,{type:'sine',vol,attack:.01,bus:musicBus});tone(mtof(m)*2,t,dur*.4,{type:'triangle',vol:vol*.25,attack:.005,bus:musicBus});}
  function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(40,t+.18);g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(musicBus);o.start(t);o.stop(t+.35)}
  const chords=[[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59]];
  const melody=[[67,.75],[67,.25],[69,1],[67,1],[72,1],[71,2],[67,.75],[67,.25],[69,1],[67,1],[74,1],[72,2],[67,.75],[67,.25],[79,1],[76,1],[72,1],[71,1],[69,2],[77,.75],[77,.25],[76,1],[72,1],[74,1],[72,3],[0,2]];
  function schedule(){
    if(!ctx)return;
    while(nextT<ctx.currentTime+.25){
      if(mode==='lofi'){
        const e=.375; // 8th note at 80bpm
        const bar=Math.floor(step/8)%4, s=step%8, ch=chords[bar];
        const sw=(s%2)?.06:0, t=nextT+sw;
        if(s===0){ch.forEach((m,i)=>epiano(m,t+i*.025,2.8,.05));tone(mtof(ch[0]-12),t,1.4,{vol:.12,bus:musicBus,attack:.02});}
        if(s===5){epiano(ch[2]+12,t,1,.025)}
        if(s===4)tone(mtof(ch[0]-12),t,1,{vol:.08,bus:musicBus,attack:.02});
        if(s===0||s===4)kick(t);
        if(s===2||s===6)noise(t,.12,{vol:.05,freq:1800,q:.7,bus:musicBus});
        if(s%2===1)noise(t,.04,{vol:.025,freq:8000,type:'highpass',bus:musicBus});
        nextT+=e; step++;
      }else{
        const beat=.5, [m,b]=melody[bdayIdx%melody.length];
        if(m){tone(mtof(m),nextT,1.2,{vol:.12,bus:musicBus});tone(mtof(m)*3,nextT,.5,{vol:.03,bus:musicBus});tone(mtof(m)*4.2,nextT,.25,{vol:.015,bus:musicBus});}
        if(bdayIdx%melody.length===0||[6,12,19].includes(bdayIdx%melody.length))tone(mtof(43+(bdayIdx%melody.length>18?5:0)),nextT,1.5,{vol:.06,bus:musicBus});
        nextT+=b*beat; bdayIdx++;
      }
    }
  }
  function applyLevel(){if(!ctx)return;const v=musicOn?.55*level:0;musicBus.gain.cancelScheduledValues(ctx.currentTime);musicBus.gain.setTargetAtTime(v,ctx.currentTime,.4)}
  function startMusic(){init();if(!ctx)return;if(!timer){nextT=ctx.currentTime+.1;timer=setInterval(schedule,50)}applyLevel()}
  const S={
    click:t=>{tone(1200,t,.06,{type:'triangle',vol:.12});tone(1800,t+.02,.05,{vol:.05})},
    wrong:t=>{tone(220,t,.18,{type:'square',vol:.07});tone(165,t+.16,.28,{type:'square',vol:.07})},
    unlock:t=>{noise(t,.08,{vol:.3,freq:2500});tone(600,t+.05,.08,{type:'square',vol:.06});[72,76,79,84].forEach((m,i)=>tone(mtof(m),t+.15+i*.09,.6,{vol:.12}))},
    whoosh:t=>{const s=ctx.createBufferSource();s.buffer=noiseBuf;const f=ctx.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(3000,t+.6);const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.3);g.gain.exponentialRampToValueAtTime(.001,t+.9);s.connect(f);f.connect(g);g.connect(sfxBus);s.start(t);s.stop(t+1)},
    pop:t=>{noise(t,.12,{vol:.5,freq:1500,q:.5});tone(900,t,.08,{vol:.15,glideTo:200})},
    sparkle:t=>{for(let i=0;i<6;i++)tone(mtof(84+[0,4,7,12,16,19][i]),t+i*.05,.3,{vol:.05})},
    boop:t=>{tone(500,t,.15,{vol:.15,glideTo:900});tone(1000,t+.08,.12,{vol:.05})},
    lamp:t=>{noise(t,.03,{vol:.4,freq:4000});tone(150,t,.05,{type:'square',vol:.05})},
    blow:t=>{const s=ctx.createBufferSource();s.buffer=noiseBuf;const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=900;const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.45,t+.15);g.gain.exponentialRampToValueAtTime(.001,t+1.1);s.connect(f);f.connect(g);g.connect(sfxBus);s.start(t);s.stop(t+1.2)},
    rustle:t=>{for(let i=0;i<5;i++)noise(t+i*.07,.08,{vol:.15,freq:3500+Math.random()*2000,q:2})},
    swoosh:t=>{noise(t,.35,{vol:.2,freq:1200,q:.8});tone(300,t,.35,{vol:.04,glideTo:900})},
    fanfare:t=>{[[67,0],[72,.12],[76,.24],[79,.36],[84,.55]].forEach(([m,d])=>{tone(mtof(m),t+d,.5,{type:'triangle',vol:.1});tone(mtof(m)/2,t+d,.5,{type:'sawtooth',vol:.02})});S.sparkle(t+.6)}
  };
  return{
    init:()=>{init();},
    sfx(n){if(!sfxOn)return;init();if(!ctx)return;try{S[n]&&S[n](ctx.currentTime+.01)}catch(e){}},
    startMusic,
    playBirthday(){mode='bday';bdayIdx=0;if(ctx)nextT=ctx.currentTime+.3},
    playLofi(){mode='lofi';step=0;if(ctx)nextT=ctx.currentTime+.3},
    setMusicLevel(l){level=l;applyLevel()},
    toggleMusic(){musicOn=!musicOn;if(musicOn)startMusic();else applyLevel();return musicOn},
    toggleSfx(){sfxOn=!sfxOn;return sfxOn}
  };
})();
window.AUDIO=AUDIO;
document.addEventListener('pointerdown',()=>AUDIO.init(),{once:true});

/* =========================================================
   HELPERS
   ========================================================= */
function bj(d=new Date()){const p=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d);const o={};p.forEach(x=>o[x.type]=x.value);if(o.hour==='24')o.hour='00';return o}
function stamp(){const o=bj();return `${o.year}${o.month}${o.day}-${o.hour}${o.minute}`}
function niceDate(){const o=bj();return `${o.year}.${o.month}.${o.day}`}
let toastT;
function toast(msg,kicker){const t=$('#toast');t.innerHTML=(kicker?`<small>${kicker}</small>`:'')+msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}
function appXY(e){const r=app.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function elCenter(el){const r=el.getBoundingClientRect(),a=app.getBoundingClientRect();return{x:r.left-a.left+r.width/2,y:r.top-a.top+r.height/2}}
function floatWord(x,y,txt){const d=document.createElement('div');d.className='floatword';d.textContent=txt;d.style.left=x+'px';d.style.top=y+'px';app.appendChild(d);setTimeout(()=>d.remove(),1900)}
function openModal(id){$(id).classList.add('open')}
function closeModal(id){$(id).classList.remove('open')}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{AUDIO.sfx('click');b.closest('.modal').classList.remove('open')});
function safeLog(ev){try{queueLog(ev)}catch(e){}}

/* particles */
const fx=$('#fx'),fctx=fx.getContext('2d');let parts=[],fxRun=false;
function sizeFx(){const r=app.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);fx.width=r.width*dpr;fx.height=r.height*dpr;fctx.setTransform(dpr,0,0,dpr,0,0)}
function burst(x,y,n=24,colors=['#ff8fab','#ffd45e','#7fd8be','#9fc8ff','#ffffff','#e5577d'],spread=4){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*spread+1;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,life:1,dec:.012+Math.random()*.018,size:2+Math.random()*3.5,c:colors[i%colors.length],star:Math.random()<.5,rot:Math.random()*6})}
  if(!fxRun){fxRun=true;requestAnimationFrame(tick)}
}
function drawStar(c,x,y,r,rot){c.save();c.translate(x,y);c.rotate(rot);c.beginPath();for(let i=0;i<4;i++){c.lineTo(0,-r*2);c.rotate(Math.PI/4);c.lineTo(0,-r*.5);c.rotate(Math.PI/4)}c.closePath();c.fill();c.restore()}
function tick(){const r=app.getBoundingClientRect();fctx.clearRect(0,0,r.width,r.height);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.985;p.life-=p.dec;fctx.globalAlpha=p.life>.5?1:p.life>.25?.6:.3;fctx.fillStyle=p.c;const s=Math.max(4,Math.round(p.size*1.4/2)*2);fctx.fillRect(Math.round(p.x/2)*2,Math.round(p.y/2)*2,s,s);if(p.star){fctx.fillRect(Math.round(p.x/2)*2-s,Math.round(p.y/2)*2,s,s);fctx.fillRect(Math.round(p.x/2)*2+s,Math.round(p.y/2)*2,s,s);fctx.fillRect(Math.round(p.x/2)*2,Math.round(p.y/2)*2-s,s,s);fctx.fillRect(Math.round(p.x/2)*2,Math.round(p.y/2)*2+s,s,s)}});
  fctx.globalAlpha=1;
  if(parts.length)requestAnimationFrame(tick);else fxRun=false}

/* =========================================================
   GATE
   ========================================================= */
const ANSWERS=['祝哥哥生日快乐','zhugegeshengrikuaile'];
const norm=s=>s.normalize('NFKC').replace(/[\s\p{P}\p{S}]/gu,'').toLowerCase();
let clueStep=0;
$('#clueBtn').onclick=()=>{AUDIO.sfx('click');const c=$('#clues');
  if(clueStep===0)c.insertAdjacentHTML('beforeend','<div>1. 拿起手机，看看九宫格键盘</div>');
  else if(clueStep===1)c.insertAdjacentHTML('beforeend','<div class="keypad">'+[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0',''],['#','']].map(([n,l])=>`<div><b>${n}</b><span>${l||'&nbsp;'}</span></div>`).join('')+'</div>');
  else if(clueStep===2){c.insertAdjacentHTML('beforeend','<div>2. 七个字的祝福，用拼音输入</div>');$('#clueBtn').classList.add('hidden')}
  clueStep++};
$('#gateForm').onsubmit=e=>{e.preventDefault();AUDIO.init();const v=norm($('#pass').value);
  if(!v){$('#err').textContent='先输入那句话';return}
  if(ANSWERS.includes(v)){unlock()}else{AUDIO.sfx('wrong');$('#err').textContent='密码错误，再试一次';const f=$('#gateForm');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake')}};
function fireworks(ms){const c=$('#fw'),g=$('#gate');const P=3,W=Math.ceil(g.clientWidth/P),H=Math.ceil(g.clientHeight/P);c.width=W;c.height=H;const x=c.getContext('2d');
  const COL=[['#ff8fab','#ffc2d1'],['#ffd45e','#fff0b8'],['#7fd8be','#c6f2e4'],['#9fc8ff','#ffffff'],['#ff9a3c','#ffd45e'],['#e5577d','#ff8fab']];
  let parts=[],rockets=[],t0=performance.now(),nextR=0;
  function launch(){const tx=W*(.15+Math.random()*.7),ty=H*(.12+Math.random()*.3);rockets.push({x:tx,y:H*.86,ty,vy:-(H*.86-ty)/38,c:COL[Math.floor(Math.random()*COL.length)]});AUDIO.sfx&&AUDIO.sfx('pop')}
  function boom(r){const n=26+Math.floor(Math.random()*12),sp=.9+Math.random()*.6;for(let i=0;i<n;i++){const a=i/n*Math.PI*2;const v=sp*(.7+Math.random()*.5);parts.push({x:r.x,y:r.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:40+Math.random()*20,m:60,c:r.c[i%2]})}
    parts.push({x:r.x,y:r.y,vx:0,vy:0,l:8,m:8,c:'#ffffff',big:1})}
  function f(now){const el=now-t0;x.clearRect(0,0,W,H);
    if(el<ms&&el>=nextR){launch();if(Math.random()<.4)launch();nextR=el+260+Math.random()*260}

  clearFlames();candlesLit=false;blowP=0;cw.style.setProperty('--fs',1);
  await sleep(900);room.classList.remove('lit');setLights(true,true);
  const c=elCenter(cw);burst(c.x,c.y-30,80,undefined,6);AUDIO.sfx('fanfare');
  setSmile(true);say('愿望收到啦！新的一岁，冲！',3200);
  const first=pendingFirst;wishDone=true;
  toast(first&&!giftThisVisit?'心愿已经封存<br>礼物解锁啦！':'心愿已经封存','许愿成功');
  AUDIO.playLofi();refreshGift();
  if(first&&!giftThisVisit)setTimeout(()=>{const g=$('#giftSpot'),gc=elCenter(g);burst(gc.x,gc.y,30)},1200);
  setTimeout(()=>{if(!candlesLit)setSmile(false)},6000)}

/* =========================================================
   GIFT  (every visit may open exactly one gift; every result is logged)
   ========================================================= */
let giftThisVisit=null; // token of the gift opened during this visit
let visitNo=0;
function refreshGift(){const g=$('#giftSpot');g.classList.remove('locked','ready','claimed');
  if(giftThisVisit){g.classList.add('claimed');g.querySelector('.tip').textContent='已拆开'}
  else if(wishDone){g.classList.add('ready');g.querySelector('.tip').textContent='拆我！'}
  else g.classList.add('locked');
  $('#giftBtn').classList.toggle('dim',!(giftThisVisit||wishDone));$('#wishBtn').classList.toggle('dim',!!giftThisVisit);if(giftThisVisit)$('#cakeWrap').classList.remove('call')}
function openGift(){AUDIO.sfx('click');
  if(giftThisVisit){showResult(giftThisVisit,false);return}
  if(!wishDone){toast('先吹蜡烛许愿<br>礼物才会解锁','还没解锁');AUDIO.sfx('wrong');return}
  AUDIO.sfx('rustle');renderChoices();openModal('#giftModal')}
$('#giftSpot').onclick=openGift;$('#giftBtn').onclick=openGift;
const GP=$('#giftPanel');
function closeBtn(){GP.querySelector('[data-x]').onclick=()=>{AUDIO.sfx('click');closeModal('#giftModal')}}
function renderChoices(){GP.innerHTML=`<button class="x" data-x>×</button><span class="kicker">二选一</span><h2>寿星的礼物</h2><p class="lead">这次进门只能拆一个礼物，<br>选了就不能反悔哦。</p>
  <button class="choice" data-c="A"><div class="tag">${iconSVG('star')}</div><h3>保留一次愿望机会</h3><p>在 2026 年 12 月 31 日前，随时向策划人兑换一个愿望。唯一条件：不违反道德。</p></button>
  <button class="choice b" data-c="B"><div class="tag">${iconSVG('gift')}</div><h3>命运翻牌</h3><p>六张神秘卡牌，只能翻开一张，每张背后都藏着不一样的结果！</p></button>`;
  closeBtn();GP.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>confirmChoice(b.dataset.c))}
function confirmChoice(c){AUDIO.sfx('click');const name=c==='A'?'保留一次愿望机会':'命运翻牌';
  GP.innerHTML=`<span class="kicker">确认一下</span><h2>确定选<br>「${name}」？</h2><p class="lead">这次进门只能拆一个，确认后就不能改啦。</p><div class="row"><button class="btn ghost" data-back>再想想</button><button class="btn" data-ok>就它了</button></div>`;
  GP.querySelector('[data-back]').onclick=()=>{AUDIO.sfx('click');renderChoices()};
  GP.querySelector('[data-ok]').onclick=()=>{if(giftThisVisit){showResult(giftThisVisit,false);return}if(c==='A')claimA();else renderCards()}}
function newTok(prefix){const r=Math.random().toString(36).slice(2,6).toUpperCase();return `${prefix}-${stamp()}-${r}`}
function claimA(){const tok=newTok('WISH');giftThisVisit=tok;refreshGift();
  safeLog({type:'gift',choice:'A',result:'愿望兑换券',token:tok});AUDIO.sfx('fanfare');showResult(tok,true)}
const OTHER=[['hug','大大的拥抱','差一点就抱到了'],['tea','奶茶一杯','可惜擦肩而过'],['clover','好运 +100','偷偷送你了'],['paw','摸头券','锅嘚刚不给摸'],['rainbow','彩虹屁一句','你今天帅到发光']];
function renderCards(){GP.innerHTML=`<span class="kicker">只能翻一张</span><h2>命运翻牌</h2><p class="lead">凭直觉，选一张翻开吧！</p><div class="cards">${[1,2,3,4,5,6].map(n=>`<div class="card" data-n="${n}"><div class="f"><span>?</span></div><div class="b"></div></div>`).join('')}</div>`;
  let busy=false;
  GP.querySelectorAll('.card').forEach(cd=>cd.onclick=()=>{if(busy||giftThisVisit)return;busy=true;const n=Number(cd.dataset.n);AUDIO.sfx('click');
    const tok=newTok(`CARD${n}`);giftThisVisit=tok;refreshGift();
    const others=OTHER.slice().sort(()=>Math.random()-.5);
    const revealed=[];let k=0;GP.querySelectorAll('.card').forEach(o=>{const m=Number(o.dataset.n);if(m===n)revealed.push(`第${m}张：旺旺大礼包（抽中）`);else revealed.push(`第${m}张：${others[k++].slice(1,2)}`)});
    safeLog({type:'gift',choice:'B',card:n,result:'旺旺大礼包',others:revealed.join('；'),token:tok});
    cd.classList.add('picked');const bk=cd.querySelector('.b');bk.classList.add('win');bk.innerHTML=`<div class="ic">${iconSVG('gift')}</div><b>旺旺大礼包</b>恭喜抽中！`;AUDIO.sfx('swoosh');cd.classList.add('flip');
    setTimeout(()=>{AUDIO.sfx('fanfare');const c=elCenter(cd);burst(c.x,c.y,60,undefined,6)},700);
    k=0;setTimeout(()=>GP.querySelectorAll('.card').forEach(o=>{if(o===cd)return;const r=others[k++];o.querySelector('.b').innerHTML=`<div class="ic">${iconSVG(r[0])}</div><b>${r[1]}</b>${r[2]}`;o.classList.add('flip','dim')}),1500);
    setTimeout(()=>{const r=document.createElement('div');r.className='row';r.style.marginTop='18px';r.innerHTML='<button class="btn alt">领取兑换券</button>';GP.appendChild(r);r.querySelector('button').onclick=()=>showResult(tok,true)},2300)})}

/* result + coupon */
function showResult(tok,fresh){openModal('#giftModal');const isA=tok.startsWith('WISH');
  GP.innerHTML=`<button class="x" data-x>×</button><span class="kicker">${fresh?'恭喜获得':'这次的礼物'}</span><h2>${isA?'愿望兑换券':'旺旺大礼包兑换券'}</h2>
  <div class="reveal"><div class="envelope" id="env"><span class="spinner"></span></div>
  <div class="row"><button class="btn alt" id="saveCoupon">下载兑换券</button></div>
  <div class="small">${fresh?'':'这次进门的礼物已经拆过啦，下次再来还能再拆一个。<br>'}把兑换券存好，兑换时出示给策划人～</div></div>`;
  closeBtn();AUDIO.sfx('swoosh');
  drawCoupon(tok).then(url=>{const env=$('#env');env.innerHTML='';const im=new Image();im.src=url;env.appendChild(im);im.onclick=()=>viewImage(url,'锅嘚刚生日兑换券.png');$('#saveCoupon').onclick=()=>{AUDIO.sfx('click');viewImage(url,'锅嘚刚生日兑换券.png')}}).catch(()=>{$('#env').innerHTML='<div style="font-size:13px">券面生成失败，请直接截图保存。<br>券号：'+tok+'</div>'});}

const imgCache={};
function loadImg(src){if(imgCache[src])return imgCache[src];return imgCache[src]=new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function drawCoupon(tok){const isA=tok.startsWith('WISH');
  try{await Promise.race([document.fonts.load('48px Px','兑换券锅嘚刚旺大礼包愿望'),new Promise(r=>setTimeout(r,1500))])}catch(e){}
  const [shiba,cake,gift]=await Promise.all([loadImg(SPR.shiba),loadImg(SPR.cake),loadImg(SPR.gift)]);
  const W=1080,H=1500,cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');c.imageSmoothingEnabled=false;
  const INK='#3a241e',F='"Px","PingFang SC","Microsoft YaHei",monospace',U=12;
  const R=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h)};
  // checker background
  for(let y=0;y<H;y+=60)for(let x=0;x<W;x+=60)R(x,y,60,60,((x+y)/60)%2?(isA?'#ffc2d1':'#bff0e0'):(isA?'#ffd6e0':'#d4f6eb'));
  // ticket with stepped (pixel) corners
  const X=72,Y=84,TW=W-144,TH=H-168;
  function stepped(x,y,w,h,col,s){R(x+s*2,y,w-s*4,h,col);R(x+s,y+s,w-s*2,h-s*2,col);R(x,y+s*2,w,h-s*4,col)}
  stepped(X+16,Y+16,TW,TH,'rgba(30,15,30,.35)',U);
  stepped(X-U,Y-U,TW+U*2,TH+U*2,INK,U);
  stepped(X,Y,TW,TH,'#fff8ec',U);
  R(X+U,Y+TH-U*2,TW-U*2,U,'#f3dcc4');R(X+TW-U*2,Y+U*2,U,TH-U*4,'#f3dcc4');
  // header band
  const HB=240;R(X+U,Y+U,TW-U*2,HB,isA?'#ff8fab':'#7fd8be');R(X+U,Y+U+HB,TW-U*2,U,INK);
  for(let i=0;i<TW-2*U;i+=48)R(X+U+i,Y+U+HB-24,24,24,isA?'#ffc2d1':'#c6f2e4');
  c.textAlign='center';c.textBaseline='alphabetic';
  c.font=`36px ${F}`;c.fillStyle=INK;c.fillText('★ 锅嘚刚的生日夜 ★',W/2,Y+84);
  c.font=`96px ${F}`;const title=isA?'愿望兑换券':'旺旺大礼包';
  c.fillStyle=INK;[[-6,0],[6,0],[0,-6],[0,6],[6,6],[12,12]].forEach(([dx,dy])=>c.fillText(title,W/2+dx,Y+206+dy));c.fillStyle='#fff';c.fillText(title,W/2,Y+206);
  // art
  const S=6;c.drawImage(shiba,W/2-396,Y+290,shiba.width*S,shiba.height*S);
  if(isA)c.drawImage(cake,W/2+42,Y+480,cake.width*S,cake.height*S);else c.drawImage(gift,W/2+90,Y+600,gift.width*S,gift.height*S);
  // pixel stars
  function pstar(x,y,s,col){[[0,-2],[0,-1],[-2,0],[-1,0],[0,0],[1,0],[2,0],[0,1],[0,2]].forEach(([a,b])=>R(x+a*s,y+b*s,s,s,col))}
  pstar(X+90,Y+330,U,'#ffd45e');pstar(X+TW-100,Y+320,U*1.5,'#ffd45e');pstar(X+TW-190,Y+440,U*.8,'#ff8fab');pstar(X+110,Y+720,U,'#9fc8ff');
  // perforation
  const py=Y+880;for(let x=X+60;x<X+TW-60;x+=48)R(x,py,24,8,'rgba(58,36,30,.5)');
  [[X-U,py-36],[X+TW-60+U,py-36]].forEach(([x,y])=>{stepped(x,y,72,72,INK,U);stepped(x+U,y+U,48,48,isA?'#ffd6e0':'#d4f6eb',6)});
  // details
  c.textAlign='left';const lx=X+72,vx=lx+180;let y=py+100;
  const lab=(t,v,col)=>{c.font=`36px ${F}`;c.fillStyle='#8a6656';c.fillText(t,lx,y);c.fillStyle=col||INK;c.font=`48px ${F}`;c.fillText(v,vx,y+4);y+=84};
  lab('持券人','锅嘚刚','#3b2a8a');
  lab('可兑换',isA?'任意一个愿望 ×1':'旺旺大礼包 ×1','#e5577d');
  lab(isA?'有效期':'签发日',isA?'2026.12.31 前':niceDate());
  lab('小规则',isA?'不可违反道德':'见到策划人当面领取');
  c.font=`24px ${F}`;c.fillStyle='rgba(58,36,30,.6)';c.fillText('NO. '+tok,lx,Y+TH-48);
  // pixel stamp
  c.save();c.translate(X+TW-200,Y+TH-210);const sc='rgba(229,87,125,.9)';
  R(-84,-84,168,12,sc);R(-84,72,168,12,sc);R(-84,-84,12,168,sc);R(72,-84,12,168,sc);R(-66,-66,132,6,sc);R(-66,60,132,6,sc);R(-66,-66,6,132,sc);R(60,-66,6,132,sc);
  c.fillStyle=sc;c.textAlign='center';c.font=`48px ${F}`;c.fillText('寿星',0,4);c.font=`24px ${F}`;c.fillText('专属认证',0,44);c.restore();
  return cv.toDataURL('image/png')}

/* viewer & save */
let viewURL='',viewName='';
function viewImage(url,name){viewURL=url;viewName=name;$('#viewImg').src=url;$('#viewer').classList.remove('hidden');
  const ua=navigator.userAgent;$('#viewTip').textContent=/MicroMessenger|QQ\/|iPhone|iPad|Android/i.test(ua)?'长按图片保存到相册，或点下方按钮':'点「下载兑换券」保存到电脑'}
$('#viewClose').onclick=()=>{AUDIO.sfx('click');$('#viewer').classList.add('hidden')};
$('#dlBtn').onclick=async()=>{AUDIO.sfx('click');
  try{const blob=await (await fetch(viewURL)).blob();const file=new File([blob],viewName,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})&&/iPhone|iPad|Android/i.test(navigator.userAgent)){await navigator.share({files:[file]});return}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=viewName;document.body.appendChild(a);a.click();a.remove();
    toast('已保存。如果没反应，请长按图片保存')}catch(e){toast('请长按图片保存到相册')}};

</script>
